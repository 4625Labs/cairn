---
version: "2.0"
services:
  scanner:
    image: semgrep/semgrep:1.180.0
    command:
      - "sh"
      - "-c"
    args:
      - "mkdir -p /tmp/w && cd /tmp/w && echo  | base64 -d | tar xz && echo  | base64 -d > run.sh && RULES_DIR=/tmp/w/rules CLONE_URL=https://github.com/chantastic/esptember.git SCAN_ID=akash-esptember SLEEP_SECS=1800 sh run.sh"
    expose:
      - port: 8080
        as: 80
        to:
          - global: true
profiles:
  compute:
    scanner:
      resources:
        cpu:
          units: 0.5
        memory:
          size: 512Mi
        storage:
          size: 1Gi
  placement:
    akash:
      pricing:
        scanner:
          denom: uact
          amount: 100
deployment:
  scanner:
    akash:
      profile: scanner
      count: 1
