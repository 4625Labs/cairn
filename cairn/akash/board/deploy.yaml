---
version: "2.0"
# Cairn Board. The provider can read this whole file: NO real secrets here.
# Replace the three CLICKHOUSE_* values in the Akash Console form at deploy time.
services:
  board:
    image: node:22-alpine
    command:
      - "sh"
      - "-c"
    args:
      - "echo  | base64 -d | gunzip > /srv/server.mjs && node /srv/server.mjs"
    env:
      - PORT=8080
      - DATA_SOURCE=clickhouse
      - CLICKHOUSE_URL=https://REPLACE_WITH_CLICKHOUSE_HOST:8443
      - CLICKHOUSE_USER=cairn_ro
      - CLICKHOUSE_PASSWORD=REPLACE_WITH_READONLY_PASSWORD
    expose:
      - port: 8080
        as: 80
        to:
          - global: true
profiles:
  compute:
    board:
      resources:
        cpu:
          units: 0.5
        memory:
          size: 512Mi
        storage:
          size: 512Mi
  placement:
    akash:
      pricing:
        board:
          denom: uact
          amount: 100
deployment:
  board:
    akash:
      profile: board
      count: 1
